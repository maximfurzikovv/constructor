services:
  - type: web
    name: excursion-constructor
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run deploy:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
